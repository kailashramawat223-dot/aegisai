<!doctype html><html><head><meta charset=utf-8><title>AEGISAI</title><meta name=viewport content="width=device-width,initial-scale=1">
<style>
:root{--bg:#050b16;--p:rgba(20,35,60,.6);--c:#22d3ee;--r:#f43f5e;--g:#34d399;--y:#fbbf24;--t:#cbd5e1}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#0b2a4a,var(--bg) 50%);color:var(--t);font:14px ui-sans-serif,system-ui;min-height:100vh}
nav{display:flex;gap:4px;padding:10px 16px;border-bottom:1px solid #1e3a5f;align-items:center;flex-wrap:wrap}nav b{color:var(--c);letter-spacing:3px;margin-right:16px}
button,select,textarea,input{background:#0b1a2e;color:var(--t);border:1px solid #1e3a5f;border-radius:6px;padding:8px 12px;font:inherit}
button{cursor:pointer}button:hover,button.on{border-color:var(--c);color:var(--c)}
main{padding:16px;max-width:1100px;margin:auto}.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.p{background:var(--p);border:1px solid #1e3a5f;border-radius:10px;padding:14px;backdrop-filter:blur(6px);margin-bottom:12px}
.n{font-size:28px;color:#fff}.CRITICAL,.BLOCK{color:var(--r)}.HIGH{color:#fb923c}.MEDIUM{color:var(--y)}.LOW,.ALLOW{color:var(--g)}
pre{background:#000;border:1px solid #1e3a5f;border-radius:8px;padding:12px;color:var(--g);white-space:pre-wrap;min-height:60px}
table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:6px;border-bottom:1px solid #1e3a5f;text-align:left}.bar{height:8px;background:var(--c);border-radius:4px;margin-bottom:6px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--g);animation:pl 1.5s infinite}@keyframes pl{50%{opacity:.2}}
</style></head><body><div id=app></div><script>
const $=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms));
let T=localStorage.t,U=null,tab="dash",S=[];
const sev=r=>r<=20?"LOW":r<=40?"MEDIUM":r<=70?"HIGH":"CRITICAL";
async function api(p,m="GET",b){const r=await fetch("/api/"+p,{method:m,headers:{"Content-Type":"application/json",Authorization:"Bearer "+T},body:b?JSON.stringify(b):undefined});const j=await r.json();if(!r.ok)throw new Error(j.detail||r.status);return j}
const TABS={dash:"Dashboard",play:"Attack Playground",tools:"Tool Gateway",ledger:"Audit Ledger",iso:"Team Isolation",demo:"Live Demo"};
function loginView(){$("#app").innerHTML=`<main style="max-width:430px;margin-top:10vh"><h1 style="color:#22d3ee;letter-spacing:5px;margin:0">AEGISAI</h1><p>Red-Team AI. Break It Safely. Defend It Automatically.</p><div class=p><input id=e value="redteam@aegis.ai" style="width:100%;margin:4px 0"><input id=pw type=password value="aegis123" style="width:100%;margin:4px 0"><button onclick="doLogin()">Launch Security Lab</button><p><small>admin@ / redteam@ / blueteam@aegis.ai · password: aegis123</small></p></div></main>`}
async function doLogin(){try{const r=await api("auth/login","POST",{email:$("#e").value,password:$("#pw").value});T=r.token;localStorage.t=T;boot()}catch(e){alert(e.message)}}
function boot(){try{U={...JSON.parse(atob(T.split(".")[1]))};U.email=U.email}catch{return loginView()}go(tab)}
async function go(k){tab=k;$("#app").innerHTML=`<nav><b>AEGISAI</b>${Object.entries(TABS).map(([a,b])=>`<button class="${a==k?'on':''}" onclick="go('${a}')">${b}</button>`).join("")}<span style="margin-left:auto"><span class=dot></span> ${U.email} · ${U.role} · ${U.team} <button onclick="localStorage.clear();location.reload()">Logout</button></span></nav><main id=m></main>`;try{await V[k]()}catch(e){$("#m").innerHTML=`<div class="p BLOCK">⛔ ${e.message}</div>`}}
async function show(r){const t=$("#tr");t.textContent="";for(const l of r.trace){t.textContent+="▸ "+l+"\n";await sleep(250)}const a=r.analysis;
$("#res").innerHTML=`<div class=p><b class=${a.decision}>${a.decision=="BLOCK"?"THREAT DETECTED":"REQUEST ALLOWED"}</b><br>Attack: ${a.attack_type} · Confidence ${Math.round(a.confidence*100)}% · Risk <span class=${a.severity}>${a.severity} (${a.risk_score})</span> · Action <span class=${a.decision}>${a.decision}</span><br>Reason: ${a.reason}<br><small>Rules: ${a.matched_rules.join(" | ")||"none"}</small>${r.tool_checks.map(c=>`<div class=${c.decision=="ALLOW"?"ALLOW":"BLOCK"}>TOOL REQUEST ${c.decision=="ALLOW"?"PASSED":"INTERCEPTED"}: ${c.tool} · ${c.risk} · ${c.decision} — ${c.reason}</div>`).join("")}<small>${r.agent.engine}: ${r.agent.response||"execution halted"}</small>${r.id?`<br><button onclick="replay(${r.id})">REPLAY ATTACK</button>`:""}</div>`}
const V={
async dash(){const d=await api("dashboard");$("#m").innerHTML=`<h2>Security Dashboard <small class=ALLOW>● Agent ${d.status}</small></h2><div class=g>${[["Total Events",d.total],["Blocked",d.blocked],["Critical Threats",d.critical],["Security Score",d.score+"%"]].map(([a,b])=>`<div class=p>${a}<div class=n>${b}</div></div>`).join("")}</div><div class=g><div class=p><b>Attack types</b><br><br>${Object.entries(d.by_type).map(([k,v])=>`<div>${k} (${v})<div class=bar style="width:${v/Math.max(d.total,1)*100}%"></div></div>`).join("")}</div><div class=p><b>Live threat feed</b><br><br>${d.recent.map(e=>`<div><span class=${sev(e.risk)}>${sev(e.risk)}</span> ${e.attack_type} — <span class=${e.decision}>${e.decision}</span> <small>${e.ts.slice(11,19)}</small></div>`).join("")}</div></div>`},
async play(){S=await api("scenarios");$("#m").innerHTML=`<h2>Attack Playground</h2><div class=g style="grid-template-columns:1fr 2fr"><div class=p><b>Attack library</b>${S.map((x,i)=>`<button style="width:100%;margin:3px 0;text-align:left" onclick="pick(${i})">${x.name}</button>`).join("")}<button onclick="runAll()" style="width:100%;margin-top:8px">RUN ALL ATTACKS</button></div><div class=p><b>Target: Aegis Research Agent</b> <span class=ALLOW>SANDBOXED</span><textarea id=pr rows=4 style="width:100%;margin:8px 0"></textarea><button onclick="exec()">EXECUTE ATTACK</button><pre id=tr>awaiting attack…</pre><div id=res></div></div></div>`;pick(0)},
async tools(){const t=await api("tools");$("#m").innerHTML=`<h2>Tool Gateway</h2><div class=g>${t.map(x=>`<div class=p><b>${x.name}</b><br>Risk <span class=${x.risk}>${x.risk}</span><br>Policy: ${x.policy}<br><br><button onclick="tc('${x.name}')">Request tool</button></div>`).join("")}</div><pre id=tr>Pick a tool to run it through the gateway…</pre>`},
async ledger(){const a=await api("audit");$("#m").innerHTML=`<h2>Audit Ledger</h2><button onclick="vf()">VERIFY LEDGER INTEGRITY</button> <button onclick="tm()">Simulate tampering (admin)</button><div id=vr class=p style="margin-top:12px">Not verified yet</div><div class=p style="overflow:auto"><table><tr><th>#<th>Time<th>User<th>Type<th>Decision<th>Risk<th>Hash<th>Prev</tr>${a.map(e=>`<tr><td>${e.id}<td>${e.ts.slice(11,19)}<td>${e.user}<td>${e.attack_type}<td class=${e.decision}>${e.decision}<td>${e.risk}<td>${e.hash.slice(0,10)}…<td>${e.prev_hash.slice(0,10)}…</tr>`).join("")}</table></div>`},
iso(){$("#m").innerHTML=`<h2>Team Isolation</h2><div class=p>Logged in as <b>${U.role}</b> / ${U.team}. Red = Sandbox A (attacks), Blue = Sandbox B (audit/detection). Probe what this identity may access, then log in as another role and compare.</div><button onclick="probe()">Run isolation probes</button><pre id=tr></pre>`},
demo(){$("#m").innerHTML=`<h2>Hackathon Demo Mode</h2><div class=p>Runs prompt injection → detection → block → tool abuse → gateway rejection → audit → risk update. (Red/Admin only)</div><button onclick="startDemo()">START LIVE DEMO</button><pre id=tr style="min-height:320px"></pre>`}};
function pick(i){$("#pr").value=S[i].prompt}
async function exec(){try{await show(await api("attacks/execute","POST",{prompt:$("#pr").value}))}catch(e){alert(e.message)}}
async function replay(id){const r=await api(`attacks/${id}/replay`,"POST");r.id=id;await show(r);$("#res").insertAdjacentHTML("beforeend",`<div class=${r.identical?"ALLOW":"BLOCK"}>Replay identical to original: ${r.identical}</div>`)}
async function runAll(){try{const rs=await api("demo/run?all=true","POST");$("#tr").textContent=rs.map(r=>`${r.analysis.decision.padEnd(6)} ${r.analysis.severity.padEnd(9)} ${String(r.analysis.risk_score).padStart(3)}  ${r.analysis.attack_type}`).join("\n")+"\n\nDashboard + ledger updated."}catch(e){alert(e.message)}}
async function tc(n){const r=await api("tools/check","POST",{tool:n});$("#tr").textContent=r.steps.join("\n   ↓\n")+`\n\n${r.decision} — ${r.reason}`}
async function vf(){const r=await api("audit/verify","POST");$("#vr").innerHTML=r.valid?`<b class=ALLOW>✓ AUDIT CHAIN VERIFIED</b><br>${r.checked}/${r.total} EVENTS VALID`:`<b class=BLOCK>✗ TAMPERING DETECTED at event #${r.broken_at}</b><br>${r.checked}/${r.total} events valid before break`}
async function tm(){try{await api("audit/tamper","POST");alert("Event modified. Now click VERIFY.")}catch(e){alert(e.message)}}
async function probe(){const o=[];for(const p of ["attacks","attacks/1","audit","dashboard"]){const r=await fetch("/api/"+p,{headers:{Authorization:"Bearer "+T}});o.push(`GET /api/${p.padEnd(10)} → ${r.status} ${r.ok?"ALLOWED":"DENIED"}`)}$("#tr").textContent=o.join("\n")}
async function startDemo(){const t=$("#tr");t.textContent="";try{const rs=await api("demo/run","POST");for(const r of rs){t.textContent+=`\n=== ${r.prompt}\n`;for(const l of r.trace){t.textContent+="▸ "+l+"\n";await sleep(600)}const a=r.analysis;t.textContent+=`⚠ ${a.attack_type} | ${a.severity} (${a.risk_score}) | ${a.decision}\n`+r.tool_checks.map(c=>`⛔ ${c.tool} ${c.decision}: ${c.reason}\n`).join("")+`✎ audit entry #${r.audit_id} hash-chained\n`;await sleep(1000)}t.textContent+="\n✔ Risk scores + dashboard updated. Open Audit Ledger → Verify."}catch(e){t.textContent=e.message}}
T?boot():loginView();
</script></body></html>
